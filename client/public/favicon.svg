  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#psGrad)" filter="url(#shadow)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  
  <!-- PulseStream Isometric Logo Geometry (Scaled and Perfectly Centered) -->
  <g transform="translate(25.5, 25.5) scale(2.75)">
